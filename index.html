
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        
        <div class="toggle-container">
            <button id="metricBtn" class="active">Metric</button>
            <button id="imperialBtn">Imperial</button>
        </div>

        <div class="input-group">
            <label for="height" id="heightLabel">Height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 175" step="any">
        </div>

        <div class="input-group">
            <label for="weight" id="weightLabel">Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 70" step="any">
        </div>

        <button id="calculateBtn">Calculate BMI</button>

        <div id="result" class="hidden">
            <h2 id="bmiValue">--</h2>
            <p id="bmiCategory">--</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
